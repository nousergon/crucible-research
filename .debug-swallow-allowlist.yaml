# .debug-swallow-allowlist.yaml -- baseline for
# tests/test_no_debug_only_swallows.py (alpha-engine-config-I10226).
#
# The class this guards: an `except Exception` whose body only records the
# failure at logger.debug(...) or discards it as a bare `pass` -- invisible
# on any entrypoint whose root logger runs at INFO. Lifted detector:
# nousergon_lib.testing.debug_swallow_guard (nousergon-lib-PR398), following
# the crucible-executor precedent (alpha-engine-config-I10031,
# crucible-executor-PR547) and .provider-linkage-allowlist.yaml
# (alpha-engine-config-I9295): a lib-level scanner, a per-repo allowlist.
#
# A new site with no entry fails the build. An entry whose `expires` has
# passed fails loudly -- re-justify or remove, never silently
# re-grandfather. An entry that no longer matches anything ALSO fails, so
# the allowance cannot quietly widen after the site it covered is gone or
# fixed.
#
# `path` + `line` identify the `except` line itself (the line the guard's
# AST walk reports). Every entry requires a `reason` naming (a) the failure
# mode swallowed and (c) the concrete recording surface (or the explicit
# "no recording surface -- carve-out" for a transport/teardown/expected-
# absence-with-fallback swallow the fleet rule's own carve-out clause
# covers), per `~/Development/CLAUDE.md` "Fail loud and fast." Every site
# also carries a matching inline `# (a) ... (c) ...` comment in the source.
#
# Sweep of alpha-engine-config-I10226: the AST detector found 19 live sites
# in this repo (vs. the issue's crude grep count of 22). Of those 19: 4 were
# upgraded to `logger.warning` (memory/semantic.py:96,120,153 and
# scoring/aggregator.py's local-cache-read exhaustion site) because raising
# was architecturally unsafe (a per-item loop; a last-resort fallback) but
# silent total failure was otherwise invisible -- those 4 no longer match
# the AST shape and so carry no allowlist entry. 0 sites were producer/
# writer/audit surfaces (this repo's signals.json / DecisionArtifact writes
# do not swallow at debug/pass), so 0 were raised. The remaining 15 are
# transport / expected-absence-with-fallback / documented in-band-
# propagation carve-outs, listed below.

