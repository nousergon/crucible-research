name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read  # only for the artifact-download fallback below

    steps:
      - name: Checkout research repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: alpha-engine-research

      # Tests import config.py, which reads yaml from the private config repo.
      # Sample files in ./config/ are documentation-only and never loaded by
      # runtime — hard-fail enforces this.
      #
      # Branch-aware: if a same-named branch exists in alpha-engine-config
      # (the convention for stacked prompt-versioning PRs), check that out
      # first. Falls back to the default branch when no matching branch
      # exists. This lets the prompt-content regression locks in
      # tests/test_prompts_no_inline_json_schema.py see the PR's prompt
      # changes instead of stale main-branch prompts.
      #
      # dependabot[bot] PRs never receive ALPHA_ENGINE_CONFIG_TOKEN — GitHub
      # withholds secrets from pull_request-triggered runs it authors, even
      # same-repo, even on a manual rerun (alpha-engine-config#7266/#7268).
      # When TOKEN comes back empty, fall back to the artifact that
      # fetch-alpha-engine-config.yml (pull_request_target, which DOES get
      # the secret, and never executes PR code) uploaded for this head SHA.
      - name: Checkout alpha-engine-config (branch-aware)
        id: direct_checkout
        env:
          TOKEN: ${{ secrets.ALPHA_ENGINE_CONFIG_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$TOKEN" ]; then
            REPO_URL="https://x-access-token:${TOKEN}@github.com/nousergon/alpha-engine-config.git"
            if git clone --depth 1 -b "$BRANCH" "$REPO_URL" alpha-engine-config 2>/dev/null; then
              echo "Checked out alpha-engine-config@$BRANCH (matching PR branch)"
            else
              git clone --depth 1 "$REPO_URL" alpha-engine-config
              echo "No matching branch '$BRANCH' in alpha-engine-config — using default branch"
            fi
          else
            echo "ALPHA_ENGINE_CONFIG_TOKEN unavailable (bot-authored PR) — falling back to fetch-alpha-engine-config.yml's artifact"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download alpha-engine-config artifact (dependabot fallback)
        if: steps.direct_checkout.outputs.fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="alpha-engine-config-${SHA}"
          ARTIFACT_ID=""
          for i in $(seq 1 30); do
            ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" --jq '.artifacts[0].id // empty')
            if [ -n "$ARTIFACT_ID" ]; then break; fi
            echo "Waiting for fetch-alpha-engine-config.yml's artifact ($i/30)..."
            sleep 10
          done
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::alpha-engine-config artifact '${ARTIFACT_NAME}' never appeared — check the 'Fetch alpha-engine-config' workflow run for this PR"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > config.zip
          mkdir -p alpha-engine-config
          unzip -q config.zip -d alpha-engine-config
          rm config.zip

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: alpha-engine-research
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # krepis>=0.59.15 (krepis-PR95, nous-ergon-ops-I738) added an
      # in-process DLP scan hook to LLMClient that shells out to gitleaks
      # and fails CLOSED (raises LLMError) when the binary is missing from
      # PATH. tests/test_eval_judge.py and friends deliberately construct a
      # REAL krepis.llm.LLMClient (only the transport is faked) so the DLP
      # hook runs for real on every evaluate_artifact() call. requirements.txt
      # pins `krepis>=0.43.0` with no ceiling, so this job resolves the DLP
      # hook version. Mirrors krepis's own working CI step (test.yml) —
      # same pinned version + sha256, do not re-derive.
      - name: Install gitleaks (for session_dlp tests)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
          sudo mkdir -p /opt/groom-llm-routing
          printf '[extend]\nuseDefault = true\n' | sudo tee /opt/groom-llm-routing/gitleaks-egress.toml > /dev/null

      - name: Run tests
        working-directory: alpha-engine-research
        run: pytest tests/ -v --cov=. --cov-report=term-missing
        env:
          PYTHONPATH: .

      - name: Security audit
        working-directory: alpha-engine-research
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@6136405582ffec1be45b6cd5aa1ef6462dbdc9e3  # main
    secrets: inherit

  # Rejects any dependency extra written with an underscore. pip <23.3 does not
  # normalise `_` to `-` in a REQUESTED extra while setuptools always normalises
  # the DECLARED one, so `pkg[flow_doctor]` matches nothing against
  # `Provides-Extra: flow-doctor` — and pip reports that as a WARNING on a
  # SUCCESSFUL exit. Measured 2026-08-12: pip 23.2.1 resolves 18 packages with
  # flow-doctor absent, 23.3.2/24.0/25.0 resolve 30 with it present. Amazon
  # Linux 2023 ships pip 23.2.1, which is how it reached production
  # (alpha-engine-config-I6963).
  #
  # This is a STATIC check on purpose. Every resolve job in this fleet upgrades
  # pip before resolving, so CI runs on a pip that normalises correctly and can
  # never reproduce the production resolver. A green resolve is not evidence.
  lint-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Lint dependency extras (no underscores)
        run: python3 scripts/lint_extras.py .
