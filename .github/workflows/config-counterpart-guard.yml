name: Config counterpart guard

# Blocks merging this repo's PRs while a same-named alpha-engine-config
# branch exists — i.e., while the PR is half of an unmerged LOCKSTEP PAIR
# (config#1592). This repo's CI clones alpha-engine-config branch-aware
# (ci.yml "Checkout alpha-engine-config (branch-aware)"), so PR CI green
# does NOT imply main CI green until the config counterpart merges: two
# main-red incidents on 2026-07-02 (runs 28608910812, 28613003459) came
# from exactly this race. When this check is RED: merge the config PR
# first, then re-run this check (Re-run jobs) to unblock.
#
# Required status check on main branch protection (context:
# "config-counterpart-merged / config-counterpart-merged"). Logic lives in
# the fleet chokepoint: nousergon-lib config-counterpart-guard.yml.

on:
  pull_request:
  # So the required context reports on a merge-queue entry instead of leaving it
  # in AWAITING_CHECKS until it auto-dequeues (alpha-engine-config-I12747). On
  # merge_group the lib callee resolves the queued PR's head branch from
  # merge_group.head_ref through the pulls API and asks the same question,
  # failing closed on any parse or API error (alpha-engine-config-I12754,
  # nousergon-lib#512). This repo runs no merge queue today, so no merge_group
  # run fires.
  merge_group:
    types: [checks_requested]

# pull-requests: read is what the callee's merge_group path uses to read the
# queued PR's head branch; without it that path fails closed. The pull_request
# path does not use it.
permissions:
  pull-requests: read

jobs:
  config-counterpart-merged:
    uses: nousergon/nousergon-lib/.github/workflows/config-counterpart-guard.yml@f7da2d63fef47cd5d89988891756d7eac7859f5c  # main, includes nousergon-lib#512
    secrets: inherit
