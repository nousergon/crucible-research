name: Provider direct-linkage guard

# Thin caller — all scan behavior lives in the reusable workflow. Edit it
# there, not here: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml
#
# Fleet-wide replacement for the per-vendor guard shape (openrouter-guard.yml
# below stays as-is for now; this covers every provider via one table in
# nousergon-lib's scripts/provider_linkage_guard.py). Brian's 2026-08-29
# ruling, verbatim: "the entire nous ergon system should now be running
# through the krepis router... we should have no other parallel setups, it
# should all funnel through the krepis router." Tracker: alpha-engine-
# config-I9294 (spine) / -I9302 (this repo). Baseline of pre-existing matches:
# .provider-linkage-allowlist.yaml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `caller-` prefix is load-bearing, not cosmetic: inside a CALLED workflow
  # `github.workflow` resolves to THIS workflow's name, so a callee declaring
  # the same expression lands in the same concurrency group and GitHub kills
  # the run with zero jobs and no check (alpha-engine-config-I7836/I7862).
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@27a6a7b31880355c566bedab3093c8a4c168677c  # nousergon-lib#371
