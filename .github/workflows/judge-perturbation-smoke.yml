name: Judge Perturbation Smoke

# CI gate for LLM-as-judge VALIDATION (ROADMAP L480, 2026-05-29).
#
# Runs a small battery of deterministic corruptions through the REAL
# judge LLM and asserts the judge catches them — the corrupted output's
# targeted rubric dimension must drop below the known-good reference.
# This validates the judge on its actual construct (process quality);
# it does NOT touch stock outcomes (that's a separate, firewalled
# system diagnostic).
#
# Triggers ONLY on PRs touching the judge code, the perturbation harness,
# or the smoke itself. Rubric PROMPT changes live in alpha-engine-config
# and reach the judge via that repo's notify-research dispatch.
#
# alpha-engine-config-I6559 (2026-08-19, crucible-research#666):
# evaluate_artifact (the sync judge path this smoke exercises via
# _default_judge) moved off direct OpenRouter onto krepis.router — this
# workflow reads NO provider API key (alpha-engine-config-I7880 removed
# the stale OPENROUTER_API_KEY injection this comment used to describe;
# the earlier I2997 OpenRouter/DeepSeek V4 Flash migration this paragraph
# once documented was itself superseded by I6559's router move).
#
# Needs the alpha-engine-config checkout (the eval rubric prompts are
# gitignored here and loaded at runtime) and a reachable router — see the
# I7853 paragraph below for the CI-runner reachability gap and how the
# smoke script's own outputs communicate it.
#
# Cost: ~6 DeepSeek V4 Flash judge calls per run (1 reference per rubric +
# one per corruption) — cents, cheaper than the pre-migration Haiku
# baseline. Tolerant caught-rate gate absorbs LLM variance; a
# regressed/insensitive judge still fails it.
#
# alpha-engine-config-I7853 (2026-08-20): this CI runner has no router-edge
# credential, so the judge call (routed through krepis.router since
# crucible-research#666) currently cannot reach any model — a
# provisioning gap, not a judge regression. The `smoke` job itself still
# exits 0 in that case (an infra gap must not hard-block every judge-code
# PR), but a SEPARATE `judge-perturbation-smoke / coverage` check run
# posts as `neutral` naming the zero judged_count whenever it happens, so
# a green `smoke` tick is never the only signal on the PR — see the "Run
# judge perturbation smoke" step's outputs and the step below it.

on:
  pull_request:
    branches: [main]
    paths:
      - "evals/judge.py"
      - "evals/perturbation.py"
      - "tests/live_smoke/judge_perturbation_smoke.py"
      - ".github/workflows/judge-perturbation-smoke.yml"
      - "requirements.txt"

# `checks: write` is needed ONLY by the "Report zero-judged coverage as a
# neutral check" step below, which posts a SEPARATE GitHub check run when
# the smoke script signals judged_count=0 (principles.md §2.7 — a bare
# `exit 0` on a provisioning gap would render identically to a real pass,
# which the neutral check exists to prevent). Every other permission stays
# at the repo default of none.
permissions:
  checks: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # dependabot[bot] PRs never receive secrets on a pull_request-triggered
    # run (GitHub withholds them even same-repo — alpha-engine-config#7266/
    # #7268), and this job needs the live ALPHA_ENGINE_CONFIG_TOKEN secret
    # (to check out the gitignored rubric prompts) plus PR-controlled code
    # (evals/judge.py, evals/perturbation.py) — unlike ci.yml's config
    # checkout, that combination can't be split safely into a
    # secrets-holding, code-executing step. A dependency bump never
    # legitimately touches judge/perturbation code (the requirements.txt
    # path filter is what pulls dependabot PRs in here incidentally), so skip
    # entirely rather than widen what a compromised dependency update could
    # exfiltrate or spend. Not a required check — skip is a clean pass.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout research repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Eval rubric prompts are gitignored here; load_prompt() resolves
      # them from $GITHUB_WORKSPACE/alpha-engine-config/research/prompts/.
      - name: Checkout alpha-engine-config (branch-aware)
        env:
          TOKEN: ${{ secrets.ALPHA_ENGINE_CONFIG_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          REPO_URL="https://x-access-token:${TOKEN}@github.com/nousergon/alpha-engine-config.git"
          if git clone --depth 1 -b "$BRANCH" "$REPO_URL" alpha-engine-config 2>/dev/null; then
            echo "Checked out alpha-engine-config@$BRANCH (matching PR branch)"
          else
            git clone --depth 1 "$REPO_URL" alpha-engine-config
            echo "No matching branch '$BRANCH' in alpha-engine-config — using default branch"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # krepis>=0.59.15 (krepis-PR95, nous-ergon-ops-I738) added an
      # in-process DLP scan hook to LLMClient that shells out to gitleaks
      # and fails CLOSED when the binary is missing from PATH. This smoke
      # makes REAL judge calls via evals/judge.py -> krepis.llm.LLMClient,
      # so the hook runs for real here too. requirements.txt pins
      # `krepis>=0.43.0` with no ceiling, so this job resolves the DLP hook
      # version. Mirrors krepis's own working CI step — same pinned version
      # + sha256, do not re-derive.
      - name: Install gitleaks (for session_dlp live calls)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
          sudo mkdir -p /opt/groom-llm-routing
          printf '[extend]\nuseDefault = true\n' | sudo tee /opt/groom-llm-routing/gitleaks-egress.toml > /dev/null

      - name: Run judge perturbation smoke
        id: run_smoke
        env:
          PYTHONPATH: .
        run: python tests/live_smoke/judge_perturbation_smoke.py

      # alpha-engine-config-I7853 stopgap. The smoke script exits 0 when
      # krepis.router finds nothing reachable (a CI provisioning gap, not a
      # judge regression — see judge_perturbation_smoke.py's module
      # docstring), so 0 perturbations judged would otherwise render
      # identically to a real PASS. principles.md §2.7 forbids that: "a
      # component emitting nothing is not healthy, it is unobserved; no
      # data is never rendered as green." This step posts a SEPARATE
      # `neutral`-concluding check run — visible on the PR, not blocking —
      # naming the zero count whenever that happens. `if: always()` so it
      # still runs after a FAIL (posting nothing, since outcome won't be
      # skip_router_unreachable then).
      #
      # Trip wire for I7853 landing: once the router-edge credential is
      # wired, resolve_group_spec stops raising, judged_count becomes >0,
      # `steps.run_smoke.outputs.outcome` is never
      # `skip_router_unreachable` again, and this step's `if` never
      # matches — the neutral check simply stops appearing. No follow-up
      # code change is needed to retire this step's *effect*; I7853 tracks
      # deleting the now-dead script branch as cleanup once that's observed
      # for a few runs.
      - name: Report zero-judged coverage as a neutral check
        if: always() && steps.run_smoke.outputs.outcome == 'skip_router_unreachable'
        env:
          GH_TOKEN: ${{ github.token }}
          JUDGED_COUNT: ${{ steps.run_smoke.outputs.judged_count }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            --method POST \
            -f name="judge-perturbation-smoke / coverage" \
            -f head_sha="${HEAD_SHA}" \
            -f status="completed" \
            -f conclusion="neutral" \
            -f "output[title]=${JUDGED_COUNT} perturbations judged — router unreachable from CI (alpha-engine-config-I7853)" \
            -f "output[summary]=krepis.router could not reach any model in the judge group from this CI runner (missing router-edge credential wiring, tracked at alpha-engine-config-I7853). judged_count=${JUDGED_COUNT}. This run's own job status is green so the provisioning gap does not hard-block the PR, but that green does NOT mean the judge was validated — see this neutral check and \$GITHUB_STEP_SUMMARY for the resolver error."
