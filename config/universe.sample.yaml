# ─────────────────────────────────────────────────────────────────────────────
# DESCRIPTIVE / DOCUMENTATION ONLY
#
# Production reads the live universe from alpha-engine-config/research/universe.yaml
# at runtime (bundled into the Research Lambda via deploy.sh). Edits to this
# .sample file affect ONLY:
#   1. New-environment bootstrap (copies this template to universe.yaml), and
#   2. Public-repo schema documentation showing the universe.yaml shape.
#
# Edits here have ZERO effect on the live system. To add/remove a tracked
# ticker, the change MUST land in alpha-engine-config (separate private repo).
# ─────────────────────────────────────────────────────────────────────────────

universe:
  - ticker: AAPL
    sector: Technology
  - ticker: MSFT
    sector: Technology
  - ticker: GOOGL
    sector: Communication Services
  - ticker: AMZN
    sector: Consumer Discretionary
  - ticker: NVDA
    sector: Technology
  - ticker: META
    sector: Communication Services
  - ticker: TSLA
    sector: Consumer Discretionary

scoring_weights:
  quant: 0.50
  qual: 0.50

rating_thresholds:
  buy: 65             # 12-month horizon: conviction holds should rate BUY by default
  sell: 40

scanner:
  candidate_count: 3
  candidate_universe: sp500_sp400    # sp500 | sp500_sp400 | russell1000
  min_avg_volume: 500000
  min_price: 10

  # Tiered rotation thresholds (§6.3 Stage 5)
  rotation_tiers:
    - max_tenure_days: 3
      min_score_diff: 12             # new entry: require large gap to prevent whipsaw
    - max_tenure_days: 10
      min_score_diff: 8              # early tenure
    - max_tenure_days: 30
      min_score_diff: 5              # established
    - max_tenure_days: 99999
      min_score_diff: 3              # long-held: low bar to rotate

  # Override: weak long-held picks lose tenure protection
  weak_pick_score_threshold: 60      # score below which tenure override applies
  weak_pick_consecutive_runs: 5      # must score below threshold for this many consecutive runs
  emergency_rotation_new_score: 70   # new candidate must score >= this for emergency override

  # Deep value path
  deep_value_path: true
  deep_value_max_rsi: 35
  deep_value_min_consensus: Buy
  deep_value_max_candidates: 10

cio:
  # Weekly cap on NET-NEW entrants the CIO may advance (candidates not already
  # held). Does NOT count reaffirmations of held BUY-rated names — those remain
  # unbounded. floor/cap are measured against net-new advances, not total.
  max_new_entrants: 10
  min_new_entrants: 2
  # Entrant bar for the min_new_entrants force-fill: a rubric-rejected fresh
  # name is force-admitted only if its CIO conviction clears this (~60 observed
  # bar). Quality gate — a saturated week (no fresh name ≥ bar) admits 0 and
  # fires the tripwire rather than injecting a sub-bar name. Set to 101 to
  # disable forcing entirely (pure-tripwire mode).
  force_fill_conviction_floor: 60
  # Below this many net-new entrants/week, emit a loud tripwire (WARN + CW
  # metric NewEntrantsBelowFloor). Defaults to min_new_entrants.
  new_entrant_alert_floor: 2
  # De-blended CIO orchestration (L4564). When true, the CIO ranks on a
  # deterministic SECTOR-NEUTRAL stock-quality score (the shared rubric's
  # per-sector bias stripped via a trailing-sector baseline from research.db)
  # and weighs the sector tilt as a SEPARATE lever — instead of the raw,
  # sector-biased composite that double-counts with the sector ratings it also
  # receives. Default false (the merge is inert). The env var
  # CIO_DEBLENDED_ORCHESTRATION on the Lambda OVERRIDES this, so the soak flips
  # ON with no redeploy.
  deblended_orchestration: false

archive:
  retain_history: true
  check_prior_candidate_records: true

alerts:
  enabled: true
  price_move_threshold_pct: 5.0
  cooldown_minutes: 60

email:
  recipients:
    - you@example.com               # Add one or more recipient email addresses
  sender: you@example.com           # Must be SES-verified (see DOCS.md)
  send_time_pt: "06:15"

schedule:
  timezone: America/Los_Angeles
  run_time: "06:15"
  frequency: trading_days
  holiday_calendar: XNYS
  run_on_early_close: true

llm:
  # CAPABILITY CLASSES, not concrete models. The registry decides which model
  # a class means (model-portability-policy I1); naming a model here would put
  # a selection fact in a consumer's config.
  #   low  = mechanical/deterministic   med = scoped reasoning
  #   high = frontier judgment          ultra = maximum capability
  per_stock_class: low        # news + research agents
  strategic_class: med        # scanner ranking, macro, consolidator
  max_tokens_per_stock: 800
  max_tokens_strategic: 4096
  concurrent_agents: 10

  # DIRECT-MODE fallback models. Used ONLY when router_base_url is unset (see
  # below), and by the call sites not yet migrated to class addressing
  # (ic_cio, canary_replay). These stay concrete model ids on purpose: while a
  # site still talks to Anthropic directly, a class name here would be sent as
  # a model name and rejected.
  per_stock_model: claude-haiku-4-5-20251001
  strategic_model: claude-sonnet-4-6

  # Where class names are resolved. LEAVE UNSET to keep talking to Anthropic
  # directly with the *_model ids above — that is the pre-migration behaviour
  # and the default, so no deployment changes behaviour until it opts in.
  #
  # Set it to gain the platform (registry routing, fallback chains, and — only
  # where the endpoint is a local proxy — DLP scanning):
  #   host running the LiteLLM router : http://127.0.0.1:8980/v1
  #   Lambda / EC2 (no local router)  : the OpenRouter base url
  # The endpoint is a DEPLOYMENT fact; the class is not. Same split thinktank
  # already uses via ProviderSpec.base_url.
  # router_base_url: http://127.0.0.1:8980/v1
  router_key_secret: LITELLM_MASTER_KEY
