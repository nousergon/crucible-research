      (config#1579) and the transitive floor `langchain-openai~=1.6` requires
      (ChatOpenAI wraps `openai.OpenAI`). agents/langchain_utils.py's
      make_agent_llm binds ChatOpenAI to `spec.base_url`/`spec.api_key`
      resolved by krepis.router.resolve_group_spec -- already established as
      the sanctioned router-bound OpenAI-wire transport in this file's
      pre-existing `agents/langchain_utils.py openai:sdk_client` entry. This
      `dist` finding is the same pattern one layer down (the package the
      wrapper needs installed), not a new call site.
    expires: "2026-12-07"
    tracking: alpha-engine-config-I10225
