# .provider-linkage-allowlist.yaml — pre-cleared direct-provider-linkage
# matches for the fleet-wide guard (nousergon-lib scripts/provider_linkage_
# guard.py; caller: .github/workflows/provider-linkage-guard.yml).
#
# Brian's ruling 2026-08-29, verbatim: "the entire nous ergon system should
# now be running through the krepis router... we should have no other
# parallel setups, it should all funnel through the krepis router."
# Tracker: alpha-engine-config-I9294 (spine) / -I9302 (this repo's baseline
# sweep). Schema: nousergon-lib scripts/provider_linkage_guard.py::load_allowlist.
#
# Every entry below is either (a) historical/documentation prose describing
# a migrated-away-from pattern, or a test asserting that pattern's ABSENCE —
# never a live call site the guard should be catching — or (b) a genuinely
# live match in a file this session was explicitly told NOT to edit (a
# sibling agent's in-flight work, or a named-but-out-of-scope defect already
# tracked elsewhere), carrying its own tracking reference and a short expiry
# so it stays visible rather than quietly widening.
